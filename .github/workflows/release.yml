name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  rules:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      ROOT: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: oven-sh/setup-bun@v2

      - name: Build preview
        run: bun run build

      - name: Package rules
        run: |
          name="effect-v4-omp-rules-${TAG}"
          mkdir -p dist stage
          cp -R preview/.omp/rules "stage/${ROOT}"
          tar -C stage -czf "dist/${name}.tar.gz" "${ROOT}"
          (cd stage && zip -qr "../dist/${name}.zip" "${ROOT}")
          (cd dist && sha256sum -- *.tar.gz *.zip > SHA256SUMS)

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
